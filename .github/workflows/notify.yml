name: Garbage Collection Notify

on:
  schedule:
    - cron: '17 18 * * *'
      timezone: "Asia/Tokyo"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          bundler-cache: true

      - name: Run notify
        env:
          AREA_ID:        ${{ secrets.AREA_ID }}
          GMAIL_USER:     ${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          NOTIFY_TO:      ${{ secrets.NOTIFY_TO }}
        run: bundle exec ruby bin/notify
